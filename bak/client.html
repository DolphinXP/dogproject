<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC Video Stream</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 100%;
            margin: 0 auto;
            padding: 10px;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.8rem;
            margin-top: 10px;
        }

        h2 {
            font-size: 1.4rem;
            margin-top: 10px;
        }

        h3 {
            font-size: 1.2rem;
            margin-top: 10px;
        }

        #videoContainer {
            position: relative;
            border: 1px solid #ccc;
            padding: 10px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f8f8f8;
        }

        #statusIndicator {
            color: #555;
            font-style: italic;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: center;
            padding: 5px;
            background-color: #f0f0f0;
            border-radius: 4px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 20px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        button:hover {
            background-color: #45a049;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        video {
            max-width: 100%;
            border: 1px solid #ddd;
            background-color: #000;
            display: block;
        }

        #videoInfo {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #666;
            text-align: center;
        }

        #log {
            height: 150px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            background-color: #f9f9f9;
            -webkit-overflow-scrolling: touch;
        }

        /* Mobile specific styles */
        @media (max-width: 767px) {
            body {
                padding: 5px;
            }

            h1 {
                font-size: 1.5rem;
                text-align: center;
            }

            .controls button {
                width: 100%;
                padding: 15px;
                margin-bottom: 5px;
            }

            #videoContainer {
                padding: 5px;
                min-height: 150px;
            }

            #log {
                height: 100px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebRTC Video Stream</h1>

        <div>
            <div id="statusIndicator">Status: Not connected</div>
            <div class="controls">
                <button id="connectButton">Connect to Stream</button>
                <button id="startCamera">Start Camera</button>
                <button id="stopCamera">Stop Camera</button>
            </div>
        </div>

        <div>
            <h2>Video Stream:</h2>
            <div id="videoContainer">
                <video id="videoElement" autoplay playsinline controls></video>
                <div id="videoInfo"></div>
            </div>
        </div>

        <h3>Log:</h3>
        <div id="log"></div>
    </div>

    <script src="/client.js"></script>
</body>
</html>
