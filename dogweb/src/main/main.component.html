<div
  class="flex flex-col w-dvw gap-2 p-4 h-full bg-[url('/images/bg-1.jpg')] bg-cover bg-center bg-no-repeat">
  <!-- top -->
  <div class="flex justify-between items-center w-full min-h-12 max-h-12 text-white">
    <div class="text-md p-2">
      Remote CPU: {{ cpuUsage }}% / Memory: {{ memoryUsage }}% / Disk: {{ diskUsage }}%
    </div>
  </div>

  <div class="flex w-full h-full gap-2 min-h-0">
    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
      <div class="flex items-center bg-gray-400/40 h-14 p-2  font-bold text-3xl text-white">
        Main: {{ viewName }}
      </div>
      <ng-container *ngIf="!isIrMain">
        <app-view-vis class="grow bg-black p-2"></app-view-vis>
      </ng-container>
      <ng-container *ngIf="isIrMain">
        <app-view-ir class="grow bg-black p-2"></app-view-ir>
      </ng-container>
    </div>

    <!-- Side Panel -->
    <div class="flex flex-col h-full w-xl p-2 gap-2">
      <ng-container *ngIf="!isIrMain">
        <app-view-ir (click)="toggleView($event)" class="h-auto bg-black sub-view"></app-view-ir>
      </ng-container>
      <ng-container *ngIf="isIrMain">
        <app-view-vis (click)="toggleView($event)" class="h-auto bg-black sub-view"></app-view-vis>
      </ng-container>

      <app-compact-list class="flex-1 overflow-auto bg-white"></app-compact-list>

    </div>
  </div>

</div>
