<p-dataView #dv [value]="detects()">
  <ng-template #list let-items>
    <div class="grid grid-nogutter">
      <div *ngFor="let item of items; let first = first">
        <div
          (click)="onItemClick(item)"
          [ngClass]="{ 'border-t border-gray-200': !first }"
          class="flex flex-col sm:flex-row sm:items-center p-4 gap-4 cursor-pointer hover:bg-gray-100"
        >
          <div class="md:w-20 relative">
            <img
              [alt]="item.name"
              [src]=" 'https://picsum.photos/64' "
              class="block xl:block mx-auto rounded-border w-full"
            />

          </div>
          <div class="flex flex-col md:flex-row justify-between flex-1 gap-2">
            <div class="flex flex-row md:flex-col justify-between items-start">
              <div class="font-semibold">{{ item.name }}</div>
            </div>

            <div class="flex flex-col ">
              <span class="">{{ item.size }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-template>

  <ng-template #emptymessage>
    <div class="text-center text-gray-400 py-8">
      暂无数据
    </div>
  </ng-template>
</p-dataView>


<app-preview-dialog></app-preview-dialog>
