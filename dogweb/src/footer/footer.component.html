<div class="flex justify-between items-center w-full text-white gap-2 p-2">
  <div class="flex gap-2 items-center p-2 flex-none">
    <img alt="Logo" class="h-12" src="images/logo.png">
    <span class="text-3xl font-bold text-white">NYU-B System</span>
  </div>
  <div class="flex items-center justify-center gap-4">

    <button (click)="onHomeClick()" class="flex items-center justify-center p-2 cursor-pointer rounded-full ">
      <img alt="Test" class="h-16 w-16 hover:filter hover:brightness-50" src="images/home.png">
    </button>

    <button #startStreamButton (click)="onStartStreamClick()"
            class="flex items-center gap-2 justify-center p-2 cursor-pointer rounded-full ">
      <img alt="Start" class="h-16 w-16 hover:filter hover:brightness-50" src="images/start.png">
    </button>
    <button #stopStreamButton (click)="onStopStreamClick($event)"
            class="flex items-center gap-2 justify-center p-2 cursor-pointer rounded-full ">
      <img alt="Stop" class="h-16 w-16 hover:filter hover:brightness-50" src="images/stop.png">
    </button>


    <button class="flex items-center justify-center p-2 cursor-pointer rounded-full ">
      <img alt="Capture" class="h-16 w-16 hover:filter hover:brightness-50" src="images/lens.png">
    </button>

    <!--    <div class="w-2"></div>-->

    <button class="flex items-center justify-center p-2 cursor-pointer rounded-full ">
      <img alt="List" class="h-16 w-16 hover:filter hover:brightness-50" src="images/list.png">
    </button>
    <button class="flex items-center justify-center p-2 cursor-pointer rounded-full ">
      <img alt="Settings" class="h-16 w-16 hover:filter hover:brightness-50" src="images/setting.png">
    </button>

    <button (click)="onTestClick()" class="flex items-center justify-center p-2 cursor-pointer rounded-full ">
      <img alt="Test" class="h-16 w-16 hover:filter hover:brightness-50" src="images/test.png">
    </button>
  </div>

  <div class=" text-xs ">Version: 0.1</div>
</div>

<app-new-task-dialog (cancelNewTask)="onNewTaskCancelled()"
                     (confirmNewTask)="onNewTaskConfirmed($event)"></app-new-task-dialog>
<p-confirmDialog/>

<p-toast></p-toast>
